<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About PT</title> <!--這行不要更改-->
    <link rel="icon" href="https://github.com/ptchen314/about/blob/main/icon.jpeg?raw=true" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Helvetica Neue", "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
            font-weight: 200;
            /* Month-tinted deep gradient, à la the PS3 dynamic theme */
            background: radial-gradient(ellipse 120% 80% at 50% 45%, #12324f 0%, #071324 48%, #01040b 100%);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            cursor: default;
        }

        /* ---------- The famous PS3 wave ---------- */
        #wave {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* faint scanline / vignette for that CRT-through-HDMI feel */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,0.45) 100%);
        }

        /* ---------- Top status bar (clock) ---------- */
        .statusbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 5;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 14px;
            padding: 20px 34px;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }
        .statusbar .date { font-size: 19px; opacity: 0.9; }
        .statusbar .time { font-size: 23px; }
        .statusbar .time .ampm { font-size: 13px; opacity: 0.8; margin-left: 3px; }

        /* ---------- XMB ---------- */
        .xmb {
            position: fixed;
            inset: 0;
            z-index: 3;
        }

        /* the horizontal cross-bar of categories */
        .cat-anchor {
            position: absolute;
            top: 34%;
            left: 26%;
            transform: translateY(-50%);
            z-index: 2; /* category always sits above the scrolling items */
        }
        .cat-track {
            display: flex;
            align-items: flex-start;
            gap: 74px;
            transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .category {
            flex: 0 0 auto;
            width: 92px;
            text-align: center;
            opacity: 0.45;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .category.active { opacity: 1; }
        .cat-icon {
            width: 92px;
            height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
            transition: transform 0.35s ease;
        }
        .cat-icon svg { width: 66px; height: 66px; }
        .cat-icon img {
            width: 78px; height: 78px;
            border-radius: 50%;
            object-fit: cover;
        }
        .category.active .cat-icon {
            transform: scale(1.22);
            filter: drop-shadow(0 0 18px rgba(140,200,255,0.75)) drop-shadow(0 4px 14px rgba(0,0,0,0.6));
        }
        .cat-label {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.35s ease;
            text-shadow: 0 1px 5px rgba(0,0,0,0.7);
        }
        .category.active .cat-label { opacity: 0.95; }

        /* ---------- the vertical item list (the Y axis of the XMB cross) ----------
           A full-height masked viewport; rows only fade at the very top and
           bottom edges of the screen. Each row is positioned absolutely by JS
           so the list can "skip over" the category row in the middle. */
        .item-viewport {
            position: fixed;
            top: 0;
            left: 26%;
            width: 520px;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            pointer-events: none; /* only the rows themselves catch clicks */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 13%, #000 87%, transparent 100%);
                    mask-image: linear-gradient(to bottom, transparent 0, #000 13%, #000 87%, transparent 100%);
        }
        .item-list { position: absolute; inset: 0; }
        .item {
            position: absolute;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 18px;
            opacity: 0.5;
            pointer-events: auto;
            cursor: pointer;
            transform: translateY(-50%); /* `top` is the row's vertical centre */
            transition: top 0.34s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.3s ease;
        }
        .item.active { opacity: 1; }
        .item-ico {
            width: 44px; height: 44px;
            flex: 0 0 44px;
            display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
            transition: width 0.3s ease, height 0.3s ease, flex-basis 0.3s ease;
        }
        .item-ico svg { width: 36px; height: 36px; }
        .item-ico img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        /* the selected row gets a big icon — the same size as a category icon */
        .item.active .item-ico { width: 88px; height: 88px; flex-basis: 88px; }
        .item.active .item-ico svg { width: 70px; height: 70px; }
        .item.active .item-ico img { width: 84px; height: 84px; }

        .item-text { display: flex; flex-direction: column; line-height: 1.25; }
        .item-title {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 0.5px;
            white-space: nowrap;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
        }
        .item.active .item-title {
            font-size: 27px;
            color: #fff;
            text-shadow: 0 0 16px rgba(150,205,255,0.65), 0 1px 6px rgba(0,0,0,0.7);
        }
        /* the description line appears only on the selected row */
        .item-sub, .motto {
            font-size: 13px;
            font-weight: 300;
            opacity: 0.7;
            margin-top: 3px;
            display: none;
        }
        .item.active .item-sub, .item.active .motto { display: block; }
        .motto {
            font-style: italic;
            min-height: 18px;
            transition: opacity 0.5s ease;
        }

        /* ---------- footer hint (button legend) ---------- */
        .legend {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 5;
            display: flex;
            justify-content: flex-end;
            gap: 26px;
            padding: 18px 34px;
            font-size: 13px;
            font-weight: 300;
            opacity: 0.85;
            text-shadow: 0 1px 5px rgba(0,0,0,0.7);
        }
        .legend span { display: inline-flex; align-items: center; gap: 8px; }
        .btn-glyph {
            display: inline-flex;
            align-items: center; justify-content: center;
            width: 22px; height: 22px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        .btn-cross { background: radial-gradient(circle at 35% 30%, #8fd0ff, #1978c8); }
        .btn-dir { background: radial-gradient(circle at 35% 30%, #d9d9d9, #7a7a7a); color:#111; }

        @media (max-width: 720px) {
            /* shift left by half a category width so the ACTIVE category lands
               dead-centre (50%), lined up with the centred item column */
            .cat-anchor { left: 50%; transform: translate(-35px, -50%); top: 26%; }
            .item-viewport { left: 50%; transform: translateX(-50%); width: min(520px, 92vw); }
            .item { justify-content: center; gap: 12px; }
            .item-text { align-items: center; text-align: center; }
            .item-title { font-size: 17px; white-space: normal; }
            .item.active .item-title { font-size: 21px; }
            .item.active .item-ico { width: 72px; height: 72px; flex-basis: 72px; }
            .item.active .item-ico svg { width: 58px; height: 58px; }
            .item.active .item-ico img { width: 70px; height: 70px; }
            .cat-track { gap: 44px; }
            .category { width: 70px; }
            .cat-icon { width: 70px; height: 70px; }
            .cat-icon svg { width: 50px; height: 50px; }
            .cat-icon img { width: 60px; height: 60px; }
            .cat-label { font-size: 11px; }
            .legend { justify-content: center; gap: 18px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <canvas id="wave"></canvas>
    <div class="vignette"></div>

    <div class="statusbar">
        <div class="date" id="date"></div>
        <div class="time" id="time"></div>
    </div>

    <div class="xmb">
        <div class="cat-anchor">
            <div class="cat-track" id="catTrack"></div>
        </div>
        <div class="item-viewport">
            <div class="item-list" id="itemList"></div>
        </div>
    </div>

    <div class="legend">
        <span><span class="btn-glyph btn-dir">✛</span> 選擇 Navigate</span>
        <span><span class="btn-glyph btn-cross">✕</span> 開啟 Enter</span>
    </div>

    <script>
    /* =========================================================
       Inline SVG icons (thin PS3-style line art)
       ========================================================= */
    const AVATAR = "https://avatars.githubusercontent.com/u/64603358?v=4";
    const ICON = {
        person: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="22" r="12"/><path d="M12 54c2-12 12-18 20-18s18 6 20 18"/></svg>`,
        friends: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="9"/><circle cx="45" cy="27" r="7"/><path d="M8 52c2-9 9-13 16-13s14 4 16 13"/><path d="M42 40c7 0 12 4 14 12"/></svg>`,
        music: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M26 44V16l24-6v28"/><circle cx="20" cy="46" r="6"/><circle cx="44" cy="42" r="6"/></svg>`,
        facebook: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M38 18h-4c-4 0-6 2-6 6v6h-6v8h6v18h8V38h6l2-8h-8v-4c0-1 .5-2 2-2h4z"/></svg>`,
        telegram: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M52 14 8 31l13 5 4 14 7-9 12 9 8-36z"/><path d="M21 36l24-16-18 20"/></svg>`,
        email: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="16" width="48" height="32" rx="3"/><path d="M10 19l22 16 22-16"/></svg>`,
        github: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8c-13 0-24 11-24 24 0 11 7 20 17 23 1 .2 1.7-.5 1.7-1.2v-4.6c-7 1.5-8.5-3-8.5-3-1-3-2.8-3.8-2.8-3.8-2.3-1.6.2-1.5.2-1.5 2.5.2 3.9 2.6 3.9 2.6 2.3 3.9 6 2.8 7.4 2.1.2-1.7.9-2.8 1.6-3.4-5.6-.6-11.5-2.8-11.5-12.5 0-2.8 1-5 2.6-6.8-.3-.7-1.1-3.2.2-6.7 0 0 2.1-.7 7 2.6 2-.6 4.2-.9 6.3-.9s4.3.3 6.3.9c4.8-3.3 7-2.6 7-2.6 1.3 3.5.5 6 .2 6.7 1.6 1.8 2.6 4 2.6 6.8 0 9.7-5.9 11.9-11.5 12.5.9.8 1.7 2.3 1.7 4.7v7c0 .7.7 1.4 1.7 1.2 10-3.3 17-12.5 17-23C56 19 45 8 32 8z"/></svg>`,
        play: `<svg viewBox="0 0 64 64" fill="none" stroke="#eaf4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="22"/><path d="M27 23l16 9-16 9z" fill="#eaf4ff"/></svg>`
    };

    /* =========================================================
       XMB data — categories (X axis) & items (Y axis)
       ========================================================= */
    const CATEGORIES = [
        {
            id: "profile",
            label: "個人檔案",
            iconImg: AVATAR,
            items: [
                { iconImg: AVATAR, title: "PT Chen", motto: true }
            ]
        },
        {
            id: "friends",
            label: "聯絡方式 Friends",
            icon: ICON.friends,
            items: [
                { icon: ICON.github,   title: "GitHub",   sub: "github.com/ptchen314",  link: "https://github.com/ptchen314" },
                { icon: ICON.facebook, title: "Facebook", sub: "PT Chen",               link: "https://www.facebook.com/profile.php?id=100070927291796" },
                { icon: ICON.telegram, title: "Telegram", sub: "@Chen_pt",              link: "https://t.me/Chen_pt" },
                { icon: ICON.email,    title: "Email",    sub: "hello@ptchen.tw",       link: "mailto:hello@ptchen.tw" }
            ]
        },
        {
            id: "music",
            label: "音樂 Music",
            icon: ICON.music,
            items: [
                { icon: ICON.play, title: "聽聽看我喜歡的音樂吧!", sub: "YouTube", link: "https://youtu.be/fDsdUoRRXTE" },
                { icon: ICON.play, title: "最近愛歌!", sub: "YouTube", link: "https://youtu.be/4g-xa8fPKLw" }
            ]
        }
    ];

    let catIndex = 0;
    let itemIndex = 0;

    const catTrack = document.getElementById("catTrack");
    const itemList = document.getElementById("itemList");

    // layout metrics differ on phones (smaller icons, category row higher up);
    // these must stay in sync with the CSS @media (max-width: 720px) block.
    const isMobile = () => window.innerWidth <= 720;
    const catStep = () => (isMobile() ? 70 + 44 : 92 + 74); // category width + gap

    /* ---------- build category bar ---------- */
    CATEGORIES.forEach((cat, i) => {
        const el = document.createElement("div");
        el.className = "category";
        el.innerHTML = `
            <div class="cat-icon">${cat.iconImg ? `<img src="${cat.iconImg}" alt="">` : cat.icon}</div>
            <div class="cat-label">${cat.label}</div>`;
        el.addEventListener("click", () => {
            if (i === catIndex) { openItem(); }
            else { catIndex = i; itemIndex = 0; render(); }
        });
        catTrack.appendChild(el);
    });

    /* ---------- build the rows for the active category (only when it changes) ---------- */
    let builtCat = -1;
    function buildItems() {
        const cat = CATEGORIES[catIndex];
        itemList.innerHTML = "";
        cat.items.forEach((it, i) => {
            const el = document.createElement("div");
            el.className = "item";
            if (it.link) el.dataset.link = it.link;
            const iconHTML = it.iconImg ? `<img src="${it.iconImg}" alt="">` : it.icon;
            const descHTML = it.motto
                ? `<div class="motto" id="motto"></div>`
                : `<div class="item-sub">${it.sub || ""}</div>`;
            el.innerHTML = `
                <div class="item-ico">${iconHTML}</div>
                <div class="item-text">
                    <div class="item-title">${it.title}</div>
                    ${descHTML}
                </div>`;
            el.addEventListener("click", () => {
                if (i === itemIndex) openItem();
                else { itemIndex = i; render(); }
            });
            itemList.appendChild(el);
        });
        builtCat = catIndex;
        if (cat.id === "profile") changeMotto();
    }

    /* ---------- position the rows: the vertical bar of the XMB cross.
       The selected row sits just below the category (with a big icon);
       earlier rows stack ABOVE the category and later rows below it, so the
       list "skips over" the category row instead of running through it. */
    function layoutItems() {
        const items = [...itemList.children];
        const m = isMobile();
        // the cross line must match the category row's CSS top (34% / 26%)
        const CY = window.innerHeight * (m ? 0.26 : 0.34);
        const GAP = m ? 54 : 60;                 // spacing between ordinary rows
        const ABOVE = CY - (m ? 62 : 84);        // the row directly above the category
        const BELOW = CY + (m ? 108 : 134);      // the selected (pinned) row, below the category label
        const SEL = m ? 72 : 86;                 // extra space the big selected row occupies
        items.forEach((el, i) => {
            const d = i - itemIndex;
            let y;
            if (d === 0) y = BELOW;                       // selected row
            else if (d > 0) y = BELOW + SEL + (d - 1) * GAP; // rows after it, going down
            else y = ABOVE - (-d - 1) * GAP;              // rows before it, stacking up above the category
            el.style.top = y + "px";
            el.classList.toggle("active", d === 0);
        });
    }

    /* ---------- render selection state ---------- */
    function render() {
        // horizontal cross-bar slides so the active category sits on the anchor
        catTrack.style.transform = `translateX(${-catIndex * catStep()}px)`;
        [...catTrack.children].forEach((el, i) =>
            el.classList.toggle("active", i === catIndex));

        if (builtCat !== catIndex) buildItems();
        layoutItems();
    }
    window.addEventListener("resize", render);

    function openItem() {
        const it = CATEGORIES[catIndex].items[itemIndex];
        if (it && it.link) window.open(it.link, it.link.startsWith("mailto:") ? "_self" : "_blank");
    }

    /* ---------- keyboard navigation ---------- */
    document.addEventListener("keydown", (e) => {
        const cat = CATEGORIES[catIndex];
        switch (e.key) {
            case "ArrowLeft":
                catIndex = (catIndex - 1 + CATEGORIES.length) % CATEGORIES.length;
                itemIndex = 0; render(); e.preventDefault(); break;
            case "ArrowRight":
                catIndex = (catIndex + 1) % CATEGORIES.length;
                itemIndex = 0; render(); e.preventDefault(); break;
            case "ArrowUp":
                itemIndex = (itemIndex - 1 + cat.items.length) % cat.items.length;
                render(); e.preventDefault(); break;
            case "ArrowDown":
                itemIndex = (itemIndex + 1) % cat.items.length;
                render(); e.preventDefault(); break;
            case "Enter":
                openItem(); e.preventDefault(); break;
        }
    });

    /* =========================================================
       Rotating motto (kept from the original page)
       ========================================================= */
    const mottos = [
        "To be or not to be",
        "在程式的海洋裡面不停溺水",
        "Monday make me broken.",
        "我想睡覺"
    ];
    function changeMotto() {
        const m = document.getElementById("motto");
        if (!m) return;
        m.style.opacity = "0";
        setTimeout(() => {
            m.textContent = mottos[Math.floor(Math.random() * mottos.length)];
            m.style.opacity = "0.7";
        }, 300);
    }
    setInterval(changeMotto, 5000);

    /* =========================================================
       Live clock (the PS3 always shows date + time, top-right)
       ========================================================= */
    function tick() {
        const now = new Date();
        const days = ["日", "一", "二", "三", "四", "五", "六"];
        const dEl = document.getElementById("date");
        const tEl = document.getElementById("time");
        dEl.textContent = `${now.getMonth() + 1}/${now.getDate()} (${days[now.getDay()]})`;
        let h = now.getHours();
        const ampm = h < 12 ? "AM" : "PM";
        h = h % 12 || 12;
        const mm = String(now.getMinutes()).padStart(2, "0");
        tEl.innerHTML = `${h}:${mm}<span class="ampm">${ampm}</span>`;
    }
    tick();
    setInterval(tick, 1000);

    /* =========================================================
       The signature PS3 flowing wave (canvas)
       Hue drifts with the month, echoing the PS3 dynamic theme.
       ========================================================= */
    const canvas = document.getElementById("wave");
    const ctx = canvas.getContext("2d");
    let W, H;
    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // month -> base hue (Jan..Dec), loosely mirroring the PS3 seasonal palette
    const MONTH_HUE = [205, 330, 140, 320, 110, 210, 185, 165, 30, 25, 355, 200];
    const baseHue = MONTH_HUE[new Date().getMonth()];
    const TWO_PI = Math.PI * 2;

    // ----- drifting motes, like the tiny particles on the PS3 home screen -----
    let particles = [];
    function seedParticles() {
        const count = Math.round((W * H) / 30000);
        particles = [];
        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.6 + 0.5,
                sp: Math.random() * 0.22 + 0.05,   // upward speed
                ph: Math.random() * TWO_PI,        // twinkle phase
                tw: Math.random() * 0.02 + 0.004   // twinkle speed
            });
        }
    }
    window.addEventListener("resize", seedParticles);
    seedParticles();

    let t = 0;
    function drawWave() {
        ctx.clearRect(0, 0, W, H);
        const cy = H * 0.5;

        // additive blending so overlapping wisps build into a soft, smoky glow
        ctx.globalCompositeOperation = "lighter";

        // ---- the signature PS3 wave: many faint glowing ribbons layered up ----
        const RIBBONS = 8;
        for (let n = 0; n < RIBBONS; n++) {
            const yOff = (n - (RIBBONS - 1) / 2) * 9;
            const amp = 30 + n * 4;
            const speed = 0.005 + n * 0.0011;
            const lightness = 68 + (n % 3) * 9;
            ctx.beginPath();
            for (let x = -20; x <= W + 20; x += 6) {
                const y = cy + yOff
                    + Math.sin(x * 0.0042 + t * speed + n * 0.9) * amp
                    + Math.sin(x * 0.013 + t * speed * 1.7 + n) * (amp * 0.32)
                    + Math.sin(x * 0.027 + t * 0.009 - n) * 5;
                x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `hsla(${baseHue + n * 3}, 85%, ${lightness}%, 0.05)`;
            ctx.lineWidth = 2.2;
            ctx.shadowColor = `hsla(${baseHue}, 90%, 72%, 0.9)`;
            ctx.shadowBlur = 28;
            ctx.stroke();
        }
        ctx.shadowBlur = 0;

        // ---- drifting motes ----
        for (const p of particles) {
            p.y -= p.sp;
            p.x += Math.sin(t * 0.008 + p.ph) * 0.12;
            if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
            const a = Math.max(0, 0.28 + Math.sin(t * p.tw + p.ph) * 0.22);
            // soft halo
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 3.4, 0, TWO_PI);
            ctx.fillStyle = `hsla(${baseHue}, 70%, 85%, ${a * 0.16})`;
            ctx.fill();
            // bright core
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, TWO_PI);
            ctx.fillStyle = `hsla(${baseHue}, 40%, 96%, ${a})`;
            ctx.fill();
        }

        ctx.globalCompositeOperation = "source-over";
        t++;
        requestAnimationFrame(drawWave);
    }
    drawWave();

    /* ---------- go ---------- */
    render();
    </script>
</body>
</html>
