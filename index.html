<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About PT</title> <!--這行不要更改-->
    <link rel="icon" href="https://github.com/ptchen314/about/blob/main/icon.jpeg?raw=true" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gl-wave"></canvas>
    <canvas id="wave"></canvas>
    <div class="vignette"></div>

    <div class="statusbar">
        <div class="date" id="date"></div>
        <div class="time" id="time"></div>
    </div>

    <div class="xmb">
        <div class="cat-anchor">
            <div class="cat-track" id="catTrack"></div>
        </div>
        <div class="item-viewport">
            <div class="item-list" id="itemList"></div>
        </div>
    </div>

    <div class="legend">
        <span><span class="btn-glyph btn-dir">✛</span> 滑動／方向鍵 Navigate</span>
        <span><span class="btn-glyph btn-cross">✕</span> 點按／Enter 開啟</span>
    </div>

    <!-- PS3 XMB WebGL wave engine — github.com/linkev/PlayStation-3-XMB (MIT) -->
    <script src="wave/background-gradients-night.js"></script>
    <script src="wave/background-gradients-day.js"></script>
    <script src="wave/spline-settings.js"></script>
    <script src="wave/particles-settings.js"></script>
    <script src="wave/spline-reverse.js"></script>
    <script src="wave/spline.js"></script>
    <script src="wave/particles.js"></script>

    <!-- site scripts: content data → background → menu logic -->
    <script src="js/data.js"></script>
    <script src="js/background.js"></script>
    <script src="js/xmb.js"></script>
</body>
</html>
